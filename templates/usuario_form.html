{% extends "base.html" %}
{% block title %}Nuevo empleado{% endblock %}
{% block content %}

<div class="page-header">
  <div>
    <div class="page-title">Nuevo empleado</div>
    <div class="page-sub">Crea una cuenta de acceso al sistema</div>
  </div>
  <a class="btn btn-outline" href="{{ url_for('usuarios') }}">&larr; Volver a empleados</a>
</div>

<div class="card form-card">
  <form method="POST">
    <div class="form-group">
      <label>Nombre completo</label>
      <input type="text" name="nombre" required>
    </div>
    <div class="form-group">
      <label>Usuario (para iniciar sesión)</label>
      <input type="text" name="usuario" required>
    </div>
    <div class="form-group">
      <label>Rol</label>
      <select name="rol">
        <option value="Vendedor">Vendedor</option>
        <option value="Administrador">Administrador</option>
      </select>
    </div>
    <div class="form-group">
      <label>Contraseña temporal</label>
      <input type="password" name="password" required>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Crear empleado</button>
      <a class="btn btn-outline" href="{{ url_for('usuarios') }}">Cancelar</a>
    </div>
  </form>
</div>

{% endblock %}
